name: Release

run-name: Release
on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release_project:
    name: Release project
    runs-on: windows-latest
    permissions:
      contents: write
    steps:

    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: true
        fetch-depth: 0

    - name: Setup mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

    # タグから 'v' を取り除いたものを変数に保存
    - name: Extract version
      id: extract-version
      run: |
        $version = "$env:GITHUB_REF_NAME".TrimStart('v')
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Install yq
      run: |
        choco install yq -y

    # aulua の VERSION 変数を置き換える
    - name: aulua variable update
      run: |
        $version = "v$env:VERSION"
        yq -i ".project.variables.VERSION = `"$version`"" ./aulua.yaml
      env:
        VERSION: ${{ steps.extract-version.outputs.version }}

    - name: Install toolchain
      run: |
        rustup toolchain install --profile minimal
      shell: bash

    - name: Cache Rust
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        add-job-id-key: false
        cache-on-failure: true

    - name: Setup cargo-edit
      uses: taiki-e/install-action@58e862542551f667fa44c8a2a4a1d64ad477c96a # v2.75.17
      with:
        tool: cargo-edit

    - name: Build project
      run: |
        mkdir release
        cargo set-version "$env:VERSION"
        au2 release --set-version "$env:VERSION"
      env:
        VERSION: ${{ steps.extract-version.outputs.version }}

    - name: Commit version change
      run: |
        git config --local user.name "GitHub Actions"
        git config --local user.email "actions@github.com"
        git add Cargo.toml Cargo.lock aulua.yaml
        if (git diff --cached --quiet) {
          Write-Host "No changes to commit"
          exit 0
        }
        git commit -m "feat: update config files version v$env:VERSION"
        git branch
        git push origin HEAD:main
      env:
        VERSION: ${{ steps.extract-version.outputs.version }}

    - name: Create release notes
      run: |
        dotnet .\tools\ChangelogExtract.cs -- .\CHANGELOG.md .\EXTRACTED.md --semver "$env:VERSION"
        Move-Item -Path "release\*.au2pkg.zip" -Destination .\
        gh release create "v$env:VERSION" --notes-file EXTRACTED.md "*.au2pkg.zip"
      env:
        VERSION: ${{ steps.extract-version.outputs.version }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

