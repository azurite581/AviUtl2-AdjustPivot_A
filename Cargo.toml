[package]
name = "中心ずらし_A"
version = "0.3.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
aviutl2 = { version = "0.39.0", features = ["generic"] }
aviutl2-eframe = "0.39.0"
egui_extras = { version = "0.35.0", features = ["all_loaders"] }
iconify = "0.3.1"
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
